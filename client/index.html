<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Messenger</title>
<style>
  :root {
    --bg-color: #0e1621;
    --header-bg: #17212b;
    --sidebar-bg: #17212b;
    --chat-bg: #0e1621;
    --msg-in: #182533;
    --msg-out: #2b5278;
    --text-color: #ffffff;
    --text-muted: #7f91a4;
    --accent: #5288c1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; overflow: hidden; }

  /* Экран входа */
  #auth-screen {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    width: 100%; padding: 20px; background: var(--bg-color);
  }
  .auth-box { width: 100%; max-width: 320px; text-align: center; }
  .auth-logo { width: 80px; height: 80px; background: var(--accent); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .auth-box h2 { margin-bottom: 20px; font-weight: 500; }
  .auth-box input {
    width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #2b394a;
    background: var(--header-bg); color: white; font-size: 16px; outline: none; transition: 0.2s;
  }
  .auth-box input:focus { border-color: var(--accent); }
  .auth-btn {
    width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--accent); color: white;
    font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px;
  }
  .auth-btn.secondary { background: var(--header-bg); margin-top: 10px; }

  /* Главный экран */
  #app-screen { display: none; width: 100%; height: 100%; flex-direction: column; position: relative; }
  
  /* Список чатов */
  #chat-list-view { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--sidebar-bg); }
  .header { padding: 15px; background: var(--header-bg); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0e1621; font-weight: 600; font-size: 18px;}
  .user-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #0e1621; cursor: pointer; }
  .user-item:active { background: #202b36; }
  .avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; margin-right: 12px; text-transform: uppercase; }
  .user-name { font-size: 16px; font-weight: 500; }

  /* Экран чата */
  #chat-view { display: none; width: 100%; height: 100%; flex-direction: column; background: var(--chat-bg); position: absolute; top: 0; left: 0; z-index: 10; }
  .chat-header { padding: 10px 15px; background: var(--header-bg); display: flex; align-items: center; border-bottom: 1px solid #0e1621; }
  .back-btn { background: none; border: none; color: var(--accent); font-size: 24px; margin-right: 15px; cursor: pointer; }
  
  #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; }
  .msg.mine { background: var(--msg-out); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.theirs { background: var(--msg-in); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg .time { font-size: 11px; color: rgba(255,255,255,0.5); float: right; margin: 5px 0 0 10px; }

  /* Поле ввода */
  #composer { padding: 10px 15px; background: var(--header-bg); display: flex; align-items: center; gap: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  #text-input { flex: 1; padding: 12px 15px; border-radius: 20px; border: none; background: var(--chat-bg); color: white; font-size: 16px; outline: none; }
  #send-btn { background: var(--accent); border: none; width: 40px; height: 40px; border-radius: 50%; color: white; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">✈️</div>
    <h2>Ваш мессенджер</h2>
    <input id="username" type="tel" placeholder="Номер телефона" />
    <input id="password" type="password" placeholder="Пароль" />
    <button class="auth-btn" onclick="register()">Создать аккаунт</button>
    <button class="auth-btn secondary" onclick="login()">Войти</button>
  </div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="app-screen">
  <!-- Список чатов -->
  <div id="chat-list-view">
    <div class="header">
      <span>Чаты</span>
    </div>
    <div id="users-list" style="overflow-y: auto; flex: 1;"></div>
  </div>

  <!-- Сам чат -->
  <div id="chat-view">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()">←</button>
      <div class="avatar" id="chat-avatar" style="width: 35px; height: 35px; font-size: 14px; margin-right: 10px;"></div>
      <div class="user-name" id="chat-name">Имя</div>
    </div>
    <div id="messages"></div>
    <div id="composer">
      <input id="text-input" placeholder="Написать сообщение..." onkeypress="handleKeyPress(event)" />
      <button id="send-btn" onclick="send()">➤</button>
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const SERVER = 'https://messenger-production-1bbb0bbd.up.railway.app'; 
let token, me, socket, currentUser = null;

// API запросы
async function api(path, method='GET', body) {
  const r = await fetch(SERVER + path, {
    method,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + (token||'') },
    body: body ? JSON.stringify(body) : undefined
  });
  return r.json();
}

async function register() {
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  if(!u || !p) return alert("Заполни все поля!");
  const res = await api('/register','POST',{ username: u, password: p });
  if (res.token) { token = res.token; me = res.user; start(); } else alert(res.error);
}

async function login() {
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const res = await api('/login','POST',{ username: u, password: p });
  if (res.token) { token = res.token; me = res.user; start(); } else alert(res.error);
}

async function start() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'flex';
  
  socket = io(SERVER, { auth: { token } });
  socket.on('message:new', (msg) => {
    const partner = msg.from === me.id ? msg.to : msg.from;
    if (currentUser && partner === currentUser.id) appendMessage(msg);
  });

  const list = await api('/users');
  const usersList = document.getElementById('users-list');
  usersList.innerHTML = '';
  
  if(list.length === 0) {
      usersList.innerHTML = '<div style="padding: 20px; color: #7f91a4; text-align: center;">Пока нет других пользователей. Зарегистрируй друга!</div>';
  }

  list.forEach(u => {
    const div = document.createElement('div');
    div.className = 'user-item';
    div.innerHTML = `
      <div class="avatar">${u.username.charAt(0)}</div>
      <div class="user-name">${u.username}</div>
    `;
    div.onclick = () => openChat(u);
    usersList.appendChild(div);
  });
}

function openChat(u) {
  currentUser = u;
  document.getElementById('chat-name').innerText = u.username;
  document.getElementById('chat-avatar').innerText = u.username.charAt(0);
  document.getElementById('chat-view').style.display = 'flex';
  
  const messagesDiv = document.getElementById('messages');
  messagesDiv.innerHTML = '';
  
  socket.emit('messages:history', { with: u.id }, rows => {
      rows.forEach(appendMessage);
  });
}

function closeChat() {
  currentUser = null;
  document.getElementById('chat-view').style.display = 'none';
}

function appendMessage(msg) {
  const messagesDiv = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + (msg.from === me.id ? 'mine' : 'theirs');
  
  // Форматируем время
  const date = new Date(msg.created_at);
  const timeStr = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
  
  div.innerHTML = `${msg.text} <span class="time">${timeStr}</span>`;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function send() {
  const input = document.getElementById('text-input');
  const text = input.value.trim();
  if (!text || !currentUser) return;
  socket.emit('message:send', { to: currentUser.id, text });
  input.value = '';
  input.focus();
}

function handleKeyPress(e) {
  if (e.key === 'Enter') send();
}
</script>
</body>
</html>
