<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini TG</title>
<style>
  body { font-family: -apple-system, sans-serif; margin:0; display:flex; height:100vh; overflow:hidden; background: #000; color: #fff; }
  #sidebar { width:120px; border-right:1px solid #333; padding:12px; overflow-y:auto; background: #111; }
  #main { flex:1; display:flex; flex-direction:column; background: #222; }
  #messages { flex:1; overflow-y:auto; padding:16px; }
  .msg { margin:6px 0; padding:8px 12px; border-radius:10px; max-width:80%; word-wrap:break-word; }
  .mine { background:#0088cc; margin-left:auto; }
  .theirs { background:#333; }
  #composer { display:flex; padding:12px; border-top:1px solid #333; gap:8px; background: #111; }
  #composer input { flex:1; padding:10px; border:1px solid #444; border-radius:8px; font-size:16px; background: #222; color: #fff; }
  .user-item { padding:10px 6px; cursor:pointer; border-radius:6px; font-size:14px; margin-bottom: 4px;}
  .user-item:hover, .user-item.active { background:#333; }
  input { margin:4px 0; padding:8px; width:100%; box-sizing:border-box; border:1px solid #444; border-radius:6px; font-size:16px; background: #222; color: #fff; }
  button { padding:10px; margin:4px 0; cursor:pointer; width:100%; border:none; border-radius:6px; background:#0088cc; color:white; font-size:16px; font-weight: bold;}
  #auth { padding-bottom: 10px; border-bottom: 1px solid #333; }
</style>
</head>
<body>
<div id="sidebar">
  <div id="auth">
    <input id="username" placeholder="логин"/>
    <input id="password" type="password" placeholder="пароль"/>
    <button onclick="register()">Регистрация</button>
    <button onclick="login()" style="background: #444;">Вход</button>
  </div>
  <div id="users" style="display:none; margin-top:12px;"></div>
</div>
<div id="main">
  <div id="messages"></div>
  <div id="composer" style="display:none;">
    <input id="text" placeholder="Сообщение..."/>
    <button onclick="send()" style="width: 50px;">➤</button>
  </div>
</div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
// ТУТ ТВОЯ ССЫЛКА ИЗ RAILWAY:
const SERVER = 'https://messenger-production-1bbb0bbd.up.railway.app';

let token, me, socket, currentUser = null;

async function api(path, method='GET', body) {
  const r = await fetch(SERVER + path, {
    method,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + (token||'') },
    body: body ? JSON.stringify(body) : undefined
  });
  return r.json();
}

async function register() {
  const res = await api('/register','POST',{ username: username.value, password: password.value });
  if (res.token) { token = res.token; me = res.user; start(); } else alert(res.error);
}

async function login() {
  const res = await api('/login','POST',{ username: username.value, password: password.value });
  if (res.token) { token = res.token; me = res.user; start(); } else alert(res.error);
}

async function start() {
  auth.style.display = 'none';
  users.style.display = 'block';
  composer.style.display = 'flex';
  socket = io(SERVER, { auth: { token } });
  socket.on('message:new', (msg) => {
    const partner = msg.from === me.id ? msg.to : msg.from;
    if (currentUser && partner === currentUser.id) appendMessage(msg);
  });
  const list = await api('/users');
  users.innerHTML = '';
  list.forEach(u => {
    const div = document.createElement('div');
    div.className = 'user-item';
    div.textContent = u.username;
    div.onclick = () => openChat(u);
    users.appendChild(div);
  });
}

function openChat(u) {
  currentUser = u;
  document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
  messages.innerHTML = '';
  socket.emit('messages:history', { with: u.id }, rows => rows.forEach(appendMessage));
}

function appendMessage(msg) {
  const div = document.createElement('div');
  div.className = 'msg ' + (msg.from === me.id ? 'mine' : 'theirs');
  div.textContent = msg.text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function send() {
  const text = document.getElementById('text').value.trim();
  if (!text || !currentUser) return;
  socket.emit('message:send', { to: currentUser.id, text });
  document.getElementById('text').value = '';
}
</script>
</body>
</html>
